  location: "@engines.tk-shotgun.location"

# soundfx (Audio/SoundFX - no dedicated DCC engine, but Software-entity
# launchers like Pro Tools are picked up automatically, same as song above.)
settings.tk-shotgun.soundfx:
  apps:
    tk-multi-launchapp: "@settings.tk-multi-launchapp"
