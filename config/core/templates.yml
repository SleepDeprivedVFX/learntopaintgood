#
# This file is one of the central points in the Shotgun Pipeline Toolkit configuration and
# a counterpart to the folder configuration structure.
#
# The folder structure underneath the project folder is used to create folders on disk -
# templates.yml (this file) refers to those folders. Therefore, the two files need to be
# in sync. This file contains an overview of all locations that are used by Sgtk.
#
# Whenever an app or an engine refers to a location on disk, it is using an entry defined in
# this file. For more information, see the Shotgun Pipeline Toolkit Documentation.



#
# The keys section contains the definitions for all the different keys that are being
# used by Sgtk. A key is a magic token that is replaced by a value at runtime, for example
# {Shot}. The section below tells Sgtk which data types and formats to expect for each key.
#
keys:
    Sequence:
        type: str
    Shot:
        type: str
    Step:
        type: str
    sg_asset_type:
        type: str
    Asset:
        type: str
    name:
        type: str
        filter_by: alphanumeric
    iteration:
        type: int
    version:
        type: int
        format_spec: "03"
    version_four:
       type: int
       format_spec: "04"
       alias: version
    timestamp:
        type: str
    width:
        type: int
    height:
        type: int
    segment_name:
        type: str

    # Represents the optional output name for frames written by the Shotgun Write Node
    nuke.output:
        alias: output
        type: str
        filter_by: alphanumeric

    # Represents the optional output name for frames written by the After Effects Publish Rendering Plugin
    afx.comp:
        alias: comp
        type: str
        filter_by: alphanumeric
    afx.mov.ext:
        alias: extension
        type: str
        choices:
            mov: Quicktime Movie (.mov)
            avi: Audio Video Interleaved (.avi)

    SEQ:
        type: sequence
        format_spec: "04"

    episode:
        type: str

    # Represents a frame sequence exported from Flame
    flame.frame:
        type: sequence
        format_spec: "08"

    eye:
        type: str

    houdini.node:
        alias: node
        type: str
    aov_name:
        type: str

    # these are used by the Hiero exporter and pipeline
    YYYY:
        type: int
        format_spec: "04"
    MM:
        type: int
        format_spec: "02"
    DD:
        type: int
        format_spec: "02"
        alias: DD
    project:
        type: str

    # These are used for the Mari UDIM pipeline:
    UDIM:
        type: sequence
        default: "<UDIM>"
    mari.channel:
        type: str
        alias: channel
    mari.layer:
        type: str
        alias: layer
    mari.project_name:
        type: str
        alias: name
    # The 3-letter show code, pulled from the Project entity's code field.
    # Used to prefix asset filenames so a file's origin project is
    # identifiable from the filename alone, outside of its folder path.
    code:
        type: str
        shotgun_entity_type: Project
        shotgun_field_name: code

    asset_name:
        type: str
        shotgun_entity_type: Asset
        shotgun_field_name: code
    task_name:
        type: str
        shotgun_entity_type: Task
        shotgun_field_name: content

    # Maya supports two extension types.
    maya_extension:
        type: str
        choices:
            ma: Maya Ascii (.ma)
            mb: Maya Binary (.mb)
        default: ma
        alias: extension

    # needed by the Alias import as reference functionality
    alias.extension:
        type: str
        filter_by: alphanumeric

    # represents the optional render pass for frames written by VRED
    vred.render_pass:
        type: str
        filter_by: alphanumeric

    # represents the image extension for frames written by VRED
    vred.render_extension:
        type: str
        choices:
            png: PNG Image
            exr: EXR Image
        default: png

    # Represents a frame sequence exported from VRED
    vred.frame:
        type: sequence
        format_spec: "05"
        alias: SEQ


#
# The paths section contains all the the key locations where files are to be stored
# by Sgtk Apps. Each path is made up of several keys (like {version} or {shot}) and
# these are defined in the keys section above.
#
# Apps use these paths as part of their configuration to define where on disk
# different files should go.
#

paths:

    # Common  path definitions to use as shorthand in order to avoid repetitive and verbose
    # templates. This also makes it easy to change any of the common root paths and have the
    # changes apply to all templates that use them.
    #
    # These don't require the standard formatting (with definition and root_name) because they
    # will be set within each template that uses the alias.
    #
    # Two roots per entity: an "entity root" with no Step, and a "step root"
    # that adds Step back on top of it, wrapped in a "tasks" folder ("tasks"
    # rather than "work" - still sorts after publish/review alphabetically,
    # same reasoning as before). No separate "work" folder inside each Step
    # either: everything under tasks/{Step}/ is implicitly WIP by virtue of
    # being under tasks/, so {Step}'s first-level subfolder is the software
    # name directly (tasks/{Step}/maya/..., tasks/{Step}/nuke/...), not
    # tasks/{Step}/work/maya/.... ALL publishes - both shared derived
    # content (renders, textures, caches, geo, elements) and
    # software-specific scene-file publishes (a .ma, .hip, .nk, .psd,
    # .xstage) - route through the single entity-level publish/ folder
    # instead, with {Step} as a subfolder inside each software/content-type
    # pool. See docs/pipeline-issues-and-fixes.md for the duplication
    # problem this replaces.
    shot_entity_root: Ep/{episode}/{Sequence}/{Shot}
    shot_step_root: '@shot_entity_root/tasks/{Step}'
    asset_entity_root: Assets/{sg_asset_type}/{Asset}
    asset_step_root: '@asset_entity_root/tasks/{Step}'
    sequence_root: Ep/{episode}/{Sequence}

    #
    # Shared publish pools. One publish/ folder per Asset/Shot, holding
    # every published thing - renders/textures/caches/geo/elements content
    # pools AND every software's scene-file publish - each as its own
    # subfolder with {Step} disambiguating inside it. Nothing publish-side
    # lives under tasks/{Step}/ any more; only work-in-progress does.
    asset_publish_area: '@asset_entity_root/publish'
    asset_render_area: '@asset_publish_area/renders'
    asset_texture_publish_area: '@asset_publish_area/textures'
    asset_cache_publish_area: '@asset_publish_area/caches'
    asset_geo_publish_area: '@asset_publish_area/geo'
    asset_element_publish_area: '@asset_publish_area/elements'
    asset_review_area: '@asset_entity_root/review'
    asset_publish_area_photoshop: '@asset_publish_area/photoshop/{Step}'
    asset_publish_area_aftereffects: '@asset_publish_area/afx/{Step}'
    asset_publish_area_maya: '@asset_publish_area/maya/{Step}'
    asset_publish_area_houdini: '@asset_publish_area/houdini/{Step}'
    asset_publish_area_nuke: '@asset_publish_area/nuke/{Step}'
    asset_publish_area_harmony: '@asset_publish_area/harmony/{Step}'

    shot_publish_area: '@shot_entity_root/publish'
    shot_render_area: '@shot_publish_area/renders'
    shot_texture_publish_area: '@shot_publish_area/textures'
    shot_cache_publish_area: '@shot_publish_area/caches'
    shot_geo_publish_area: '@shot_publish_area/geo'
    shot_element_publish_area: '@shot_publish_area/elements'
    shot_review_area: '@shot_entity_root/review'
    shot_publish_area_photoshop: '@shot_publish_area/photoshop/{Step}'
    shot_publish_area_aftereffects: '@shot_publish_area/afx/{Step}'
    shot_publish_area_maya: '@shot_publish_area/maya/{Step}'
    shot_publish_area_houdini: '@shot_publish_area/houdini/{Step}'
    shot_publish_area_nuke: '@shot_publish_area/nuke/{Step}'
    shot_publish_area_harmony: '@shot_publish_area/harmony/{Step}'


    ##########################################################################################
    # Project level paths
    #

    #
    # Photoshop
    #

    # The location of WIP files
    photoshop_shot_work:
        definition: '@shot_step_root/photoshop/{Shot}_{Step}_v{version}.psd'
    shot_work_area_photoshop:
        definition: '@shot_step_root/photoshop'
    # The location of backups of WIP files
    photoshop_shot_snapshot:
        definition: '@shot_step_root/photoshop/snapshots/{Shot}_{Step}_v{version}.{timestamp}.psd'
    # The location of published files - shared publish pool, see
    # shot_publish_area_photoshop above.
    photoshop_shot_publish:
        definition: '@shot_publish_area_photoshop/{Shot}_{Step}_v{version}.psd'
    # The location of the published images
    photoshop_shot_png_publish:
        definition: '@shot_publish_area_photoshop/{Shot}_{Step}_v{version}.png'
    photoshop_shot_jpg_publish:
        definition: '@shot_publish_area_photoshop/{Shot}_{Step}_v{version}.jpg'

    #
    # After Effects
    #

    # The location of WIP files
    aftereffects_shot_work:
        definition: '@shot_step_root/afx/{Shot}_{Step}_v{version}.aep'
    shot_work_area_aftereffects:
        definition: '@shot_step_root/afx'
    # The location of backups of WIP files
    aftereffects_shot_snapshot:
        definition: '@shot_step_root/afx/snapshots/{Shot}_{Step}_v{version}.{timestamp}.aep'
    # The location of published files - shared publish pool.
    aftereffects_shot_publish:
        definition: '@shot_publish_area_aftereffects/{Shot}_{Step}_v{version}.aep'
    # Shared elements pool - see shot_element_publish_area above.
    aftereffects_shot_render_pub_mono:
        definition: '@shot_element_publish_area/{Step}/{name}/v{version}/{width}x{height}/{Shot}_{name}_{afx.comp}_v{version}.{SEQ}.tif'
    # The following template uses {afx.mov.ext} this is a special key, that will be only there
    # in the beta to support different extensions on mac and windows, while using the same
    # output module (Lossless with Alpha)
    # Shared review pool - see shot_review_area above.
    aftereffects_shot_render_movie:
        definition: '@shot_review_area/{Step}/{Shot}_{name}_{afx.comp}_v{version}.{afx.mov.ext}'


    #
    # Maya
    #

    # define the location of a work area
    shot_work_area_maya:
        definition: '@shot_step_root/maya'
    # The location of WIP files
    maya_shot_work:
        definition: '@shot_step_root/maya/{Shot}_{Step}_v{version}.{maya_extension}'
    # The location of backups of WIP files
    maya_shot_snapshot:
        definition: '@shot_step_root/maya/snapshots/{Shot}_{Step}_v{version}.{timestamp}.{maya_extension}'
    # The location of published maya files - shared publish pool, see
    # shot_publish_area_maya above.
    maya_shot_publish:
        definition: '@shot_publish_area_maya/{Shot}_{Step}_v{version}.{maya_extension}'


    #
    # Houdini
    #

    # define the location of a work area
    shot_work_area_houdini:
        definition: '@shot_step_root/houdini'
    # The location of WIP files
    houdini_shot_work:
        definition: '@shot_step_root/houdini/{Shot}_{Step}_v{version}.hip'
    # The location of backups of WIP files
    houdini_shot_snapshot:
        definition: '@shot_step_root/houdini/snapshots/{Shot}_{Step}_v{version}.{timestamp}.hip'
    # The location of published houdini files - shared publish pool.
    houdini_shot_publish:
        definition: '@shot_publish_area_houdini/{Shot}_{Step}_v{version}.hip'
    # Alembic caches - work-in-progress, not a registered publish, so this
    # stays task/software-scoped rather than joining the shared caches pool.
    houdini_shot_work_alembic_cache:
        definition: '@shot_step_root/houdini/cache/alembic/{name}/{houdini.node}/v{version}/{Shot}_{name}_v{version}.abc'

    # Rendered images - work-in-progress renders, stays task-scoped (only
    # registered/published renders join the shared renders pool).
    houdini_shot_render:
        definition: '@shot_step_root/images/{name}/{houdini.node}/v{version}/{width}x{height}/{Shot}_{name}_v{version}.{SEQ}.exr'

    # Additional mantra outputs
    houdini_shot_ifd:
        definition: '@shot_step_root/ifds/{name}/{houdini.node}/v{version}/{width}x{height}/{Shot}_{name}_v{version}.{SEQ}.ifd'

    houdini_shot_dcm:
        definition: '@shot_step_root/dcms/{name}/{houdini.node}/v{version}/{width}x{height}/{Shot}_{name}_v{version}.{SEQ}.dcm'

    houdini_shot_extra_plane:
        definition: '@shot_step_root/images/{name}/{houdini.node}/{aov_name}/v{version}/{width}x{height}/{Shot}_{name}_v{version}.{SEQ}.exr'


    #
    # Nuke
    #

    # define the location of a work area
    shot_work_area_nuke:
        definition: '@shot_step_root/nuke'
    # The location of WIP script files
    nuke_shot_work:
        definition: '@shot_step_root/nuke/{Shot}_{Step}_v{version}.nkind'
    # The location of backups of WIP files
    nuke_shot_snapshot:
        definition: '@shot_step_root/nuke/snapshots/{Shot}_{Step}_v{version}.{timestamp}.nkind'
    # The location of published nuke script files - shared publish pool.
    nuke_shot_publish:
        definition: '@shot_publish_area_nuke/{Shot}_{Step}_v{version}.nkind'
    # write node outputs - work-in-progress, stays task-scoped
    nuke_shot_render_mono_dpx:
        definition: '@shot_step_root/images/{name}/v{version}/{width}x{height}/{Shot}_{name}_{nuke.output}_v{version}.{SEQ}.dpx'
    # Published write node outputs join the shared elements pool.
    nuke_shot_render_pub_mono_dpx:
        definition: '@shot_element_publish_area/{Step}/{name}/v{version}/{width}x{height}/{Shot}_{name}_{nuke.output}_v{version}.{SEQ}.dpx'
    nuke_shot_render_stereo:
        definition: '@shot_step_root/images/{name}/v{version}/{width}x{height}/{Shot}_{name}_{nuke.output}_{eye}_v{version}.{SEQ}.exr'
    nuke_shot_render_pub_stereo:
        definition: '@shot_element_publish_area/{Step}/{name}/v{version}/{width}x{height}/{Shot}_{name}_{nuke.output}_{eye}_v{version}.{SEQ}.exr'
    # review output - shared review pool, see shot_review_area above.
    shot_quicktime_quick:
        definition: '@shot_review_area/{Step}/quickdaily/{Shot}_{name}_{iteration}.mov'
    nuke_shot_render_movie:
        definition: '@shot_review_area/{Step}/{Shot}_{name}_{nuke.output}_v{version}.mov'

    # asset
    # define the location of a work area
    asset_work_area_harmony:
        definition: '@asset_step_root/harmony'

    # The location of WIP files
    # A Harmony scene is a whole folder (.xstage + .aux + elements/, frames/,
    # palette-library/, etc.), named to match the established production
    # convention: {Asset}_{Step}_v{version}/{Asset}_{Step}_v{version}.xstage
    harmony_asset_work:
        definition: '@asset_work_area_harmony/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.xstage'

    # The location of backups of WIP files
    # Note that snapshots folder is  not inside the wip folder
    # otherwise we could confuse the publishing process when files
    # need to be copied from work to publish.
    harmony_asset_snapshot:
        definition: '@asset_work_area_harmony/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.xstage'

    # Shared publish pool - see asset_publish_area_harmony above.
    harmony_asset_publish:
        definition: '@asset_publish_area_harmony/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.xstage'

    # Harmony render output now joins the shared renders pool instead of a
    # harmony-only renders folder - a Harmony render and (say) a Toon
    # Boom/other-software render for the same Step now land in the same
    # place. See asset_render_area above.
    harmony_asset_render_area:
        definition: '@asset_render_area/{Step}/{Asset}_{name}.v{version}'
    harmony_asset_render_sequence:
        definition: '@harmony_asset_render_area/{Asset}_{name}.v{version}.{SEQ}.png'
    harmony_asset_render_movie:
        definition: '@harmony_asset_render_area/{Asset}_{name}.v{version}.mov'

    # shot
    # define the location of a work area
    shot_work_area_harmony:
        definition: '@shot_step_root/harmony'

    # The location of WIP files
    # A Harmony scene is a whole folder (.xstage + .aux + elements/, frames/,
    # palette-library/, etc.), named to match the established production
    # convention: {Shot}_{Step}_v{version}/{Shot}_{Step}_v{version}.xstage
    harmony_shot_work:
        definition: '@shot_work_area_harmony/{Shot}_{Step}_v{version}/{Shot}_{Step}_v{version}.xstage'

    # The location of backups of WIP files
    # Note that snapshots folder is  not inside the wip folder
    # otherwise we could confuse the publishing process when files
    # need to be copied from work to publish.
    harmony_shot_snapshot:
        definition: '@shot_work_area_harmony/snapshots/{Shot}_{Step}_v{version}.{timestamp}.xstage'

    # The location of published harmony files - shared publish pool.
    harmony_shot_publish:
        definition: '@shot_publish_area_harmony/{Shot}_{Step}_v{version}/{Shot}_{Step}_v{version}.xstage'

    # Harmony render output - see comment on harmony_asset_render_area above.
    harmony_shot_render_area:
        definition: '@shot_render_area/{Step}/{Shot}_{name}.v{version}'
    harmony_shot_render_sequence:
        definition: '@harmony_shot_render_area/{Shot}_{name}.v{version}.{SEQ}.png'
    harmony_shot_render_movie:
        definition: '@harmony_shot_render_area/{Shot}_{name}.v{version}.mov'

    # sequence
    # define the location of a work area
    sequence_work_area_harmony:
        definition: '@sequence_root/work/harmony'

    # define the location of a publish area
    sequence_publish_area_harmony:
        definition: '@sequence_root/publish/harmony'

    # The location of WIP files
    # Mirrors the asset/shot convention below (no on-disk sequence-level
    # Harmony scenes exist yet to verify against, so this is by symmetry
    # rather than confirmed production evidence). sequence_root never had
    # Step in it, so there's nothing to restructure here.
    harmony_sequence_work:
        definition: '@sequence_work_area_harmony/{Sequence}_{Step}_v{version}/{Sequence}_{Step}_v{version}.xstage'

    # The location of backups of WIP files
    # Note that snapshots folder is  not inside the wip folder
    # otherwise we could confuse the publishing process when files
    # need to be copied from work to publish.
    harmony_sequence_snapshot:
        definition: '@sequence_work_area_harmony/snapshots/{Sequence}_{Step}_v{version}.{timestamp}.xstage'

    # The location of published harmony files
    harmony_sequence_publish:
        definition: '@sequence_publish_area_harmony/{Sequence}_{Step}_v{version}/{Sequence}_{Step}_v{version}.xstage'


#    ##########################################################################################
    # Asset pipeline

    #
    # Alembic caches
    #

    asset_alembic_cache:
        definition: '@asset_cache_publish_area/{Step}/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.abc'

    # Shot-side geometry cache publish - mirrors asset_alembic_cache above,
    # using the shot naming convention ({Shot}_{Step}_v{version}, no
    # code/sg_asset_type prefix, matching maya_shot_publish). Fields here
    # must stay a subset of what maya_shot_work actually produces in its
    # filename (Shot, Step, version) - see docs/pipeline-issues-and-fixes.md
    # and this session's asset_alembic_cache fix for why.
    shot_alembic_cache:
        definition: '@shot_cache_publish_area/{Step}/{Shot}_{Step}_v{version}.abc'


    #
    # Photoshop
    #

    # The location of WIP files
    photoshop_asset_work:
        definition: '@asset_step_root/photoshop/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.psd'
    asset_work_area_photoshop:
        definition: '@asset_step_root/photoshop'
    # The location of backups of WIP files
    photoshop_asset_snapshot:
        definition: '@asset_step_root/photoshop/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.psd'
    # The location of published files - shared publish pool.
    photoshop_asset_publish:
        definition: '@asset_publish_area_photoshop/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.psd'
    # The location of the published images
    photoshop_asset_png_publish:
        definition: '@asset_publish_area_photoshop/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.png'
    photoshop_asset_jpg_publish:
        definition: '@asset_publish_area_photoshop/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.jpg'
    #
    # after effects
    #

    # The location of WIP files
    aftereffects_asset_work:
        definition: '@asset_step_root/afx/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.aep'
    asset_work_area_aftereffects:
        definition: '@asset_step_root/afx'
    # The location of backups of WIP files
    aftereffects_asset_snapshot:
        definition: '@asset_step_root/afx/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.aep'
    # The location of published files - shared publish pool.
    aftereffects_asset_publish:
        definition: '@asset_publish_area_aftereffects/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.aep'
    aftereffects_asset_render_pub_mono:
        definition: '@asset_element_publish_area/{Step}/{name}/v{version}/{width}x{height}/{Asset}_{name}_{afx.comp}_v{version}.{SEQ}.tif'
    # The following template uses {afx.mov.ext} this is a special key, that will be only there
    # in the beta to support different extensions on mac and windows, while using the same
    # output module (Lossless with Alpha)
    aftereffects_asset_render_movie:
        definition: '@asset_review_area/{Step}/{Asset}_{name}_{afx.comp}_v{version}.{afx.mov.ext}'


    # Maya
    #

    # define the location of a work area
    asset_work_area_maya:
        definition: '@asset_step_root/maya'
    # The location of WIP files
    maya_asset_work:
        definition: '@asset_step_root/maya/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{maya_extension}'
    # The location of backups of WIP files
    maya_asset_snapshot:
        definition: '@asset_step_root/maya/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.{maya_extension}'
    # The location of published maya files - shared publish pool.
    maya_asset_publish:
        definition: '@asset_publish_area_maya/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{maya_extension}'


    #
    # Houdini
    #

    # define the location of a work area
    asset_work_area_houdini:
        definition: '@asset_step_root/houdini'
    # The location of WIP files
    houdini_asset_work:
        definition: '@asset_step_root/houdini/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.hip'
    # The location of backups of WIP files
    houdini_asset_snapshot:
        definition: '@asset_step_root/houdini/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.hip'
    # The location of published houdini files - shared publish pool.
    houdini_asset_publish:
        definition: '@asset_publish_area_houdini/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.hip'
    # Alembic caches - work-in-progress, stays task/software-scoped (see
    # houdini_shot_work_alembic_cache above for the same reasoning).
    houdini_asset_work_alembic_cache:
        definition: '@asset_step_root/houdini/cache/alembic/{name}/{houdini.node}/v{version}/{Asset}_{name}_v{version}.abc'

    # Rendered images - work-in-progress, stays task-scoped.
    houdini_asset_render:
        definition: '@asset_step_root/images/{name}/{houdini.node}/v{version}/{width}x{height}/{Asset}_{name}_v{version}.{SEQ}.exr'

    # Additional mantra outputs
    houdini_asset_ifd:
        definition: '@asset_step_root/ifds/{name}/{houdini.node}/v{version}/{width}x{height}/{Asset}_{name}_v{version}.{SEQ}.ifd'

    houdini_asset_dcm:
        definition: '@asset_step_root/dcms/{name}/{houdini.node}/v{version}/{width}x{height}/{Asset}_{name}_v{version}.{SEQ}.dcm'

    houdini_asset_extra_plane:
        definition: '@asset_step_root/images/{name}/{houdini.node}/{aov_name}/v{version}/{width}x{height}/{Asset}_{name}_v{version}.{SEQ}.exr'


    #
    # Nuke
    #

    # define the location of a work area
    asset_work_area_nuke:
        definition: '@asset_step_root/nuke'
    # outputs from the Shotgun Write Node for assets - work-in-progress,
    # stays task-scoped.
    nuke_asset_render:
        definition: '@asset_step_root/images/{name}/v{version}/{width}x{height}/{Asset}_{name}_{nuke.output}_v{version}.{SEQ}.exr'
    # Published write node outputs join the shared elements pool.
    nuke_asset_render_pub:
        definition: '@asset_element_publish_area/{Step}/{name}/v{version}/{width}x{height}/{Asset}_{name}_{nuke.output}_v{version}.{SEQ}.exr'
    # review output - shared review pool
    nuke_asset_render_movie:
        definition: '@asset_review_area/{Step}/{Asset}_{name}_{nuke.output}_v{version}.mov'
    asset_quicktime_quick:
        definition: '@asset_review_area/{Step}/quickdaily/{Asset}_{name}_{iteration}.mov'
    # The location of WIP script files
    nuke_asset_work:
        definition: '@asset_step_root/nuke/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.nkind'
    # The location of backups of WIP files
    nuke_asset_snapshot:
        definition: '@asset_step_root/nuke/snapshots/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.{timestamp}.nkind'
    # The location of published nuke script files - shared publish pool.
    nuke_asset_publish:
        definition: '@asset_publish_area_nuke/{code}_{Asset}_{sg_asset_type}_{Step}_v{version}.nkind'


#
# The strings section is similar to the paths section - but rather than defining paths
# on disk, it contains a list of strings. Strings are typically used when you want to be
# able to configure the way data is written to shotgun - it may be the name field for a
# review version or the formatting of a publish.
#

strings:

    # when a review Version in Shotgun is created inside of Nuke, this is the
    # name that is being given to it (the code field)
    nuke_shot_version_name: "{Shot}_{name}_{nuke.output}_v{version}.{iteration}"
    nuke_quick_shot_version_name: "{Shot}_{name}_quick_{iteration}"

    nuke_asset_version_name: "{Asset}_{name}_{nuke.output}_v{version}.{iteration}"
    nuke_quick_asset_version_name: "{Asset}_{name}_quick_{iteration}"

    # defines how the {tk_version} token in Hiero gets formatted back to tk.
    hiero_version: "{version}"

    # define how new Mari projects should be named
    mari_asset_project_name: "{mari.project_name} - Asset {asset_name}, {task_name}"
